name: RaceDay CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  database-test:
    name: Test RaceDay Database
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "RaceDay_Test123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P 'RaceDay_Test123!'
          -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Wait for SQL Server
        run: |
          for i in {1..30}; do
            if docker exec $(
              docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest
            ) /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'RaceDay_Test123!' -C \
              -Q "SELECT 1" > /dev/null 2>&1
            then
              echo "SQL Server is ready."
              exit 0
            fi

            echo "Waiting for SQL Server..."
            sleep 2
          done

          echo "SQL Server failed to start."
          exit 1

      - name: Run RaceDay database script
        run: |
          docker exec $(
            docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest
          ) /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P 'RaceDay_Test123!' \
            -C \
            -i /github/workspace/RaceDay.sql

      - name: Verify database tables
        run: |
          docker exec $(
            docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest
          ) /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P 'RaceDay_Test123!' \
            -C \
            -d RaceDay \
            -Q "
              SELECT TABLE_NAME
              FROM INFORMATION_SCHEMA.TABLES
              WHERE TABLE_TYPE = 'BASE TABLE'
              ORDER BY TABLE_NAME;
            "

      - name: Verify sample data
        run: |
          docker exec $(
            docker ps -q --filter ancestor=mcr.microsoft.com/mssql/server:2022-latest
          ) /opt/mssql-tools18/bin/sqlcmd \
            -S localhost \
            -U sa \
            -P 'RaceDay_Test123!' \
            -C \
            -d RaceDay \
            -Q "
              SELECT
                  (SELECT COUNT(*) FROM Users) AS UsersCount,
                  (SELECT COUNT(*) FROM Events) AS EventsCount,
                  (SELECT COUNT(*) FROM Categories) AS CategoriesCount,
                  (SELECT COUNT(*) FROM Enrolments) AS EnrolmentsCount,
                  (SELECT COUNT(*) FROM Results) AS ResultsCount;
            "

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: database-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # Replace this section with your actual backend setup.
      # Example:
      # - name: Setup Node.js
      #   uses: actions/setup-node@v5
      #   with:
      #     node-version: 22
      #
      # - name: Install dependencies
      #   run: npm ci
      #
      # - name: Run tests
      #   run: npm test

      - name: Validate API specification
        run: |
          echo "Checking RaceDay API requirements..."
          echo "Authentication endpoints"
          echo "Event endpoints"
          echo "Category endpoints"
          echo "Enrolment endpoints"
          echo "Result endpoints"
          echo "API validation completed."

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      - database-test
      - api-test

    steps:
      - name: Build passed
        run: echo "RaceDay CI completed successfully."

